<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E3A8A" flood-opacity="0.35" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#93C5FD" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base with 3D Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Top Highlight -->
  <rect x="32" y="32" width="448" height="224" rx="112" fill="url(#glowGrad)" />

  <!-- Outer Ring Detail -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Modern Geometric "FLEX" Spark / Diamond Play Arrow Badge -->
  <!-- Layer 1: Right Facing Modern Play Wing -->
  <path d="M190 140 L340 244 C355 252 355 260 340 268 L190 372 C175 380 160 372 160 354 L160 158 C160 140 175 132 190 140 Z" 
        fill="#FFFFFF" 
        filter="url(#dropShadow)" />
  
  <!-- Layer 2: Futuristic Electric Cyan Accent Overlay -->
  <path d="M240 175 L350 248 C362 254 362 258 350 264 L240 337 C228 343 218 337 218 322 L218 190 C218 175 228 169 240 175 Z" 
        fill="url(#accentGrad)" 
        opacity="0.9" />

  <!-- Sparkle / Star Core Accent -->
  <circle cx="280" cy="256" r="28" fill="#FFFFFF" filter="url(#innerGlow)" />
  <circle cx="280" cy="256" r="14" fill="#2563EB" />
  
  <!-- 4 Tiny Sparkle Dots -->
  <circle cx="380" cy="160" r="10" fill="#93C5FD" opacity="0.85" />
  <circle cx="140" cy="350" r="8" fill="#93C5FD" opacity="0.6" />
</svg>
